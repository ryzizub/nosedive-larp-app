name: Release Android app to internal track on Play Store when GitHub release is created

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  deploy-or-die:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Recover Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      - name: Download release certificate
        id: release_cert
        uses: timheuer/base64-to-file@v1.0.3
        with:
          fileName: 'dive.jks'
          encodedString: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      - name: Bump version
        uses: chkfung/android-version-actions@v1.2.2
        with:
          gradlePath: app/dive/build.gradle
          versionCode: ${{ github.run_number}}
          versionName: ${{ github.event.release.tag_name }}  
      - name: Build release app
        run: ./gradlew assembleRelease bundleRelease
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.release_cert.outputs.filePath }}
          RELEASE_KEY_ALIAS: dive
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Publish artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs
      - name: Upload to Play Store Internal track
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          packageName: me.vavra.dive
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          changesNotSentForReview: false   